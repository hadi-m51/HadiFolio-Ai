<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الإدارة — HadiFolio-Ai</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  
  <style>
    #adminContent { display: none; }
    .admin-container {
      padding: 120px 20px 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--gradient-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--white-10);
      border-radius: var(--radius-lg);
      padding: 20px;
      text-align: center;
    }
    .stat-card i {
      font-size: 2rem;
      margin-bottom: 10px;
      color: var(--gold-400);
    }
    .stat-card h3 {
      font-size: 2rem;
      margin-bottom: 5px;
      color: var(--white);
    }
    .stat-card p {
      font-size: 0.9rem;
      color: var(--slate-400);
    }
    .users-table-container {
      background: var(--gradient-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--white-10);
      border-radius: var(--radius-lg);
      padding: 20px;
      overflow-x: auto;
    }
    .users-table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }
    .users-table th, .users-table td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--white-10);
    }
    .users-table th {
      color: var(--gold-400);
      font-weight: 600;
    }
    .users-table tr:hover {
      background: rgba(255,255,255,0.02);
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .badge.pending { background: rgba(245, 158, 11, 0.2); color: var(--amber-400); }
    .badge.approved { background: rgba(16, 185, 129, 0.2); color: var(--emerald-400); }
    .badge.cancelled { background: rgba(244, 63, 94, 0.2); color: var(--rose-400); }
    
    .action-select {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--slate-700);
      color: var(--white);
      padding: 6px;
      border-radius: 4px;
      font-family: inherit;
    }
    .action-btn {
      background: var(--gold-500);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .action-btn:hover { background: var(--gold-400); }
  </style>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HadiFolio-Ai">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
</head>
<body>
  <div class="bg-pattern"></div>

  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.svg" alt="HadiFolio-Ai" class="logo-img">
        <span>لوحة الإدارة</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">الرئيسية</a></li>
      </ul>
      <div class="nav-actions">
      </div>
    </div>
  </nav>

  <!-- This will be shown via firebase-init.js ONLY if user is admin -->
  <div id="adminContent">
    <div class="admin-container">
      <h2 style="margin-bottom: 20px; color: var(--gold-400);"><i class="fa-solid fa-gauge"></i> الإحصائيات العامة</h2>
      
      <div class="stats-grid">
        <div class="stat-card">
          <i class="fa-solid fa-eye"></i>
          <h3 id="statVisits">0</h3>
          <p>إجمالي الزيارات</p>
        </div>
        <div class="stat-card">
          <i class="fa-solid fa-users"></i>
          <h3 id="statTotalUsers">0</h3>
          <p>إجمالي الحسابات</p>
        </div>
        <div class="stat-card">
          <i class="fa-solid fa-user-check" style="color:var(--emerald-400)"></i>
          <h3 id="statActiveUsers">0</h3>
          <p>حسابات مفعلة</p>
        </div>
        <div class="stat-card">
          <i class="fa-solid fa-user-clock" style="color:var(--amber-400)"></i>
          <h3 id="statPendingUsers">0</h3>
          <p>طلبات بانتظار القبول</p>
        </div>
      </div>

      <h2 style="margin-bottom: 20px; color: var(--gold-400);"><i class="fa-solid fa-users-gear"></i> إدارة المستخدمين والباقات</h2>
      <div class="users-table-container">
        <table class="users-table">
          <thead>
            <tr>
              <th>الاسم</th>
              <th>الإيميل</th>
              <th>تاريخ الانضمام</th>
              <th>الحالة</th>
              <th>انتهاء الباقة</th>
              <th>تخصيص الباقة (أيام)</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="7" style="text-align:center;">جاري جلب البيانات... <i class="fa-solid fa-spinner fa-spin"></i></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script type="module" src="js/firebase-init.js"></script>
  <script>
    window.loadAdminData = async function() {
      try {
        // Load visits
        const statsDoc = await window.fbGetDoc(window.fbDoc(window.fbDb, 'statistics', 'global'));
        if(statsDoc.exists()) {
          document.getElementById('statVisits').innerText = statsDoc.data().visits || 0;
        }

        // Load users
        const usersSnapshot = await window.fbGetDocs(window.fbCollection(window.fbDb, 'users'));
        let total = 0, active = 0, pending = 0;
        let html = '';

        usersSnapshot.forEach(docSnap => {
          const u = docSnap.data();
          const uid = docSnap.id;
          total++;
          if(u.status === 'approved') active++;
          if(u.status === 'pending') pending++;

          let statusBadge = u.status === 'approved' ? '<span class="badge approved">مفعل</span>' : 
                            u.status === 'pending' ? '<span class="badge pending">معلق</span>' : 
                            '<span class="badge cancelled">ملغي</span>';
                            
          let expiryDate = u.subscription_expiry ? new Date(u.subscription_expiry).toLocaleDateString('ar-SA') : 'لا يوجد';

          html += `
            <tr>
              <td>${u.name || '-'}</td>
              <td>${u.email}</td>
              <td>${new Date(u.joined_at).toLocaleDateString('ar-SA')}</td>
              <td>
                <select id="status_${uid}" class="action-select">
                  <option value="pending" ${u.status === 'pending' ? 'selected':''}>معلق</option>
                  <option value="approved" ${u.status === 'approved' ? 'selected':''}>مفعل</option>
                  <option value="cancelled" ${u.status === 'cancelled' ? 'selected':''}>إلغاء/تعطيل</option>
                </select>
              </td>
              <td id="expiry_${uid}" style="direction:ltr;">${expiryDate}</td>
              <td>
                <select id="package_${uid}" class="action-select">
                  <option value="0">- اختر التمديد -</option>
                  <option value="7">7 أيام</option>
                  <option value="30">شهر واحد</option>
                  <option value="90">3 أشهر</option>
                  <option value="180">6 أشهر</option>
                  <option value="365">سنة كاملة</option>
                </select>
              </td>
              <td>
                <button onclick="saveUser('${uid}')" class="action-btn">حفظ التعديلات</button>
              </td>
            </tr>
          `;
        });

        document.getElementById('statTotalUsers').innerText = total;
        document.getElementById('statActiveUsers').innerText = active;
        document.getElementById('statPendingUsers').innerText = pending;
        document.getElementById('usersTableBody').innerHTML = html || '<tr><td colspan="7" style="text-align:center;">لا يوجد مستخدمين بعد</td></tr>';

      } catch(e) {
        console.error(e);
        document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:red;">حدث خطأ أثناء جلب البيانات</td></tr>';
      }
    }

    async function saveUser(uid) {
      const status = document.getElementById(`status_${uid}`).value;
      const pkgDays = parseInt(document.getElementById(`package_${uid}`).value);
      
      let updates = { status: status };

      if(pkgDays > 0) {
        // Add days from today
        const exp = new Date();
        exp.setDate(exp.getDate() + pkgDays);
        updates.subscription_expiry = exp.toISOString();
      }

      try {
        await window.fbUpdateDoc(window.fbDoc(window.fbDb, 'users', uid), updates);
        alert('تم حفظ التعديلات بنجاح');
        loadAdminData(); // refresh
      } catch(e) {
        console.error(e);
        alert('حدث خطأ أثناء الحفظ');
      }
    }
  </script>
</body>
</html>
