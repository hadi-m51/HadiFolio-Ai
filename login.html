<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — HadiFolio-Ai</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/logo.svg">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px 40px 20px; /* Top padding to clear fixed navbar */
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      text-align: center;
      border-radius: var(--radius-xl);
    }
    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      object-fit: contain;
    }
    .form-group {
      text-align: right;
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      margin-bottom: 8px;
      color: var(--slate-300);
      font-size: 0.9rem;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--slate-700);
      border-radius: var(--radius-md);
      color: var(--white);
      font-family: inherit;
      transition: all 0.3s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--gold-400);
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--slate-400);
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--slate-700);
    }
    .divider span {
      padding: 0 10px;
    }
    .btn-social {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--slate-700);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-social:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
    .register-link {
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--slate-400);
    }
    .register-link a {
      color: var(--gold-400);
      text-decoration: none;
      font-weight: bold;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.svg" alt="HadiFolio-Ai" class="logo-img">
        <span>HadiFolio-Ai</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="chat.html">الاستشارة</a></li>
        <li><a href="browse.html">الأنظمة</a></li>
        <li><a href="court-finder.html">المحكمة</a></li>
        <li><a href="deadlines.html">المدد</a></li>
        <li><a href="forms.html">النماذج</a></li>
        <li><a href="quiz.html">اختبار</a></li>
      </ul>

      <div class="nav-actions">
        <a href="login.html" class="nav-login-btn" title="تسجيل الدخول">
          <i class="fa-regular fa-user"></i>
        </a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="فتح القائمة">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="login-container">
    <div class="glass-card login-card animate-on-scroll">
      <img src="images/logo.svg" alt="HadiFolio-Ai" class="login-logo">
      <h2 style="margin-bottom: 8px; color: var(--gold-400);">تسجيل الدخول</h2>
      <p style="color: var(--slate-400); margin-bottom: 30px; font-size: 0.9rem;">مرحباً بك مجدداً في المرجع القانوني الذكي</p>
      
      <form onsubmit="event.preventDefault(); alert('خاصية تسجيل الدخول قيد التطوير!');">
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-input" placeholder="أدخل بريدك الإلكتروني" required>
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" class="form-input" placeholder="أدخل كلمة المرور" required>
          <div style="text-align: left; margin-top: 8px;">
            <a href="#" style="color: var(--slate-400); font-size: 0.8rem; text-decoration: none;">هل نسيت كلمة المرور؟</a>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          تسجيل الدخول <i class="fa-solid fa-arrow-right-to-bracket" style="margin-right: 8px;"></i>
        </button>
      </form>

      <div class="divider"><span>أو الدخول بواسطة</span></div>
      
      <button class="btn btn-social" style="width: 100%; padding: 12px; margin-bottom: 12px;" onclick="alert('التسجيل عبر جوجل قيد التطوير')">
        <i class="fa-brands fa-google" style="color: #ea4335; font-size: 1.2rem;"></i> جوجل (Google)
      </button>
      
      <button class="btn btn-social" style="width: 100%; padding: 12px;" onclick="alert('التسجيل عبر نفاذ قيد التطوير')">
        <i class="fa-solid fa-fingerprint" style="color: #22c55e; font-size: 1.2rem;"></i> النفاذ الوطني (Nafath)
      </button>

      <div class="register-link">
        ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p><span class="footer-brand"><i class="fa-solid fa-scale-balanced"></i> HadiFolio-Ai</span> — مساعد أكاديمي قانوني سعودي</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
