<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعداد المذكرات القانونية — HadiFolio-Ai</title>
  <meta name="description" content="أنشئ هيكل مذكرة قانونية احترافية مع استشهاد تلقائي بالمواد النظامية السعودية.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="bg-pattern"></div>

  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.svg" alt="HadiFolio-Ai" class="logo-img">
        <span>HadiFolio-Ai</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="chat.html">الاستشارة</a></li>
        <li><a href="browse.html">الأنظمة</a></li>
        <li><a href="court-finder.html">المحكمة</a></li>
        <li><a href="deadlines.html">المدد</a></li>
        <li><a href="quiz.html">اختبار</a></li>
      </ul>

      <div class="nav-actions">
        <a href="login.html" class="nav-login-btn" title="تسجيل الدخول">
          <i class="fa-regular fa-user"></i>
        </a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="فتح القائمة">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-icon"><i class="fa-solid fa-pen-to-square"></i></div>
    <h1>إعداد المذكرات القانونية</h1>
    <p>أنشئ هيكل مذكرة قانونية احترافية مع الاستشهاد بالمواد النظامية</p>
  </div>

  <div class="container" style="padding-top: var(--space-10); padding-bottom: var(--space-16);">
    <div style="max-width: 900px; margin: 0 auto;">
      <form id="memoForm" class="glass-card">
        <div class="form-group">
          <label class="form-label">نوع المذكرة</label>
          <select id="memoType" class="form-select">
            <option value="claim">صحيفة دعوى</option>
            <option value="defense">مذكرة جوابية (دفاع)</option>
            <option value="appeal">لائحة اعتراض (استئناف)</option>
            <option value="reply">مذكرة رد</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">وقائع القضية</label>
          <textarea id="memoFacts" class="form-textarea" rows="8" placeholder="اذكر وقائع القضية بالتفصيل...&#10;مثال: أبرمت عقد بيع عقار مع المدعى عليه بتاريخ 1445/01/15 بمبلغ 500,000 ريال، وسددت كامل المبلغ، إلا أنه امتنع عن نقل الملكية..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          <i class="fa-solid fa-pen-to-square"></i> إعداد المذكرة
        </button>
      </form>

      <div id="memoResult" style="margin-top: var(--space-6);"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p><span class="footer-brand"><i class="fa-solid fa-scale-balanced"></i> HadiFolio-Ai</span> — مساعد أكاديمي قانوني سعودي</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
