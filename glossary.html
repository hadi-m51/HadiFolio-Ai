<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شرح المصطلحات القانونية — HadiFolio-Ai</title>
  <meta name="description" content="قاموس تفاعلي للمصطلحات القانونية السعودية مع شرح أكاديمي وأمثلة من الأنظمة.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="bg-pattern"></div>

  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.svg" alt="HadiFolio-Ai" class="logo-img">
        <span>HadiFolio-Ai</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="chat.html">الاستشارة</a></li>
        <li><a href="browse.html">الأنظمة</a></li>
        <li><a href="court-finder.html">المحكمة</a></li>
        <li><a href="deadlines.html">المدد</a></li>
        <li><a href="quiz.html">اختبار</a></li>
      </ul>

      <div class="nav-actions">
        <a href="login.html" class="nav-login-btn" title="تسجيل الدخول">
          <i class="fa-regular fa-user"></i>
        </a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="فتح القائمة">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-icon"><i class="fa-solid fa-book-open-reader"></i></div>
    <h1>شرح المصطلحات القانونية</h1>
    <p>قاموس تفاعلي للمصطلحات القانونية مع أمثلة من الأنظمة السعودية</p>
  </div>

  <div class="container" style="padding-top: var(--space-10); padding-bottom: var(--space-16);">
    <div style="max-width: 900px; margin: 0 auto;">
      <form id="glossaryForm" class="glass-card">
        <div class="form-group">
          <label class="form-label">ابحث عن مصطلح قانوني</label>
          <input type="text" id="glossaryTerm" class="form-input" placeholder="مثال: الدفع بعدم الاختصاص، القرينة، حجية الأمر المقضي..." required>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: var(--space-6);">
          <button type="button" class="btn btn-ghost" style="font-size:0.8rem" onclick="document.getElementById('glossaryTerm').value='الاختصاص المكاني';document.getElementById('glossaryForm').requestSubmit();">الاختصاص المكاني</button>
          <button type="button" class="btn btn-ghost" style="font-size:0.8rem" onclick="document.getElementById('glossaryTerm').value='القرينة القضائية';document.getElementById('glossaryForm').requestSubmit();">القرينة القضائية</button>
          <button type="button" class="btn btn-ghost" style="font-size:0.8rem" onclick="document.getElementById('glossaryTerm').value='حجية الأمر المقضي';document.getElementById('glossaryForm').requestSubmit();">حجية الأمر المقضي</button>
          <button type="button" class="btn btn-ghost" style="font-size:0.8rem" onclick="document.getElementById('glossaryTerm').value='الصلح القضائي';document.getElementById('glossaryForm').requestSubmit();">الصلح القضائي</button>
          <button type="button" class="btn btn-ghost" style="font-size:0.8rem" onclick="document.getElementById('glossaryTerm').value='الضرر المعنوي';document.getElementById('glossaryForm').requestSubmit();">الضرر المعنوي</button>
          <button type="button" class="btn btn-ghost" style="font-size:0.8rem" onclick="document.getElementById('glossaryTerm').value='الحيازة';document.getElementById('glossaryForm').requestSubmit();">الحيازة</button>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          <i class="fa-solid fa-book-open-reader"></i> ابحث عن المصطلح
        </button>
      </form>

      <div id="glossaryResult" style="margin-top: var(--space-6);"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p><span class="footer-brand"><i class="fa-solid fa-scale-balanced"></i> HadiFolio-Ai</span> — مساعد أكاديمي قانوني سعودي</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
