<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="bg-pattern"></div>

  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.svg" alt="HadiFolio-Ai" class="logo-img">
        <span>HadiFolio-Ai</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="chat.html">الاستشارة</a></li>
        <li><a href="browse.html">الأنظمة</a></li>
        <li><a href="court-finder.html">المحكمة</a></li>
        <li><a href="deadlines.html">المدد</a></li>
        <li><a href="quiz.html">اختبار</a></li>
      </ul>

      <div class="nav-actions">
        <a href="login.html" class="nav-login-btn" title="تسجيل الدخول">
          <i class="fa-regular fa-user"></i>
        </a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="فتح القائمة">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-icon"><i class="fa-solid fa-scale-balanced"></i></div>
    <h1>مقارنة المواد النظامية</h1>
    <p>قارن بين أحكام الأنظمة المختلفة حول موضوع محدد</p>
  </div>

  <div class="container" style="padding-top: var(--space-10); padding-bottom: var(--space-16);">
    <div style="max-width: 900px; margin: 0 auto;">
      <form id="compareForm" class="glass-card">
        <div class="form-group">
          <label class="form-label">موضوع المقارنة</label>
          <input type="text" id="compareTopic" class="form-input" placeholder="مثال: إجراءات الطعن، قواعد الإثبات، شروط قبول الدعوى..." required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
          <div class="form-group">
            <label class="form-label">النظام الأول</label>
            <select id="compareLaw1" class="form-select">
              <option value="نظام المرافعات الشرعية">نظام المرافعات الشرعية</option>
              <option value="نظام الإجراءات الجزائية">نظام الإجراءات الجزائية</option>
              <option value="نظام الإثبات">نظام الإثبات</option>
              <option value="نظام المعاملات المدنية">نظام المعاملات المدنية</option>
              <option value="نظام الأحوال الشخصية">نظام الأحوال الشخصية</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">النظام الثاني</label>
            <select id="compareLaw2" class="form-select">
              <option value="نظام الإجراءات الجزائية">نظام الإجراءات الجزائية</option>
              <option value="نظام المرافعات الشرعية">نظام المرافعات الشرعية</option>
              <option value="نظام الإثبات">نظام الإثبات</option>
              <option value="نظام المعاملات المدنية">نظام المعاملات المدنية</option>
              <option value="نظام الأحوال الشخصية">نظام الأحوال الشخصية</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          <i class="fa-solid fa-scale-balanced"></i> ابدأ المقارنة
        </button>
      </form>

      <div id="compareResult" style="margin-top: var(--space-6);"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p><span class="footer-brand"><i class="fa-solid fa-scale-balanced"></i> HadiFolio-Ai</span> — مساعد أكاديمي قانوني سعودي</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
